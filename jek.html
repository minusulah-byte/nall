<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nall is back</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080b20;
    color: white;
    text-align: center;
}

header {
    padding: 20px;
    background: #111633;
    color: #00e5ff;
}

section {
    padding: 30px 15px;
}

.box {
    max-width: 400px;
    margin: 30px auto;
    padding: 30px 20px;
    background: #151b40;
    border-radius: 15px;
    box-shadow: 0 0 20px #000;
}

input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: none;
    border-radius: 8px;
    font-size: 16px;
}

button {
    padding: 13px 25px;
    margin: 8px;
    border: none;
    border-radius: 8px;
    background: #00c853;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #00a844;
}

.hidden {
    display: none !important;
}

#menu h2 {
    margin-bottom: 15px;
}

#game {
    width: 350px;
    height: 550px;
    max-width: 95vw;
    margin: 15px auto;
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(white 1px, transparent 1px);
    background-size: 35px 35px;
    background-color: #050718;
    border: 3px solid #3949ab;
    border-radius: 12px;
}

/* Pesawat pemain */
#player {
    position: absolute;
    width: 42px;
    height: 42px;
    background: #00e5ff;
    clip-path: polygon(50% 0%, 100% 100%, 50% 75%, 0% 100%);
    bottom: 20px;
    left: 154px;
}

/* Peluru */
.bullet {
    position: absolute;
    width: 5px;
    height: 15px;
    background: #00ff66;
    border-radius: 5px;
}

/* Musuh */
.enemy {
    position: absolute;
    width: 38px;
    height: 38px;
    background: #ff1744;
    clip-path: polygon(
        50% 0%,
        100% 35%,
        80% 100%,
        20% 100%,
        0% 35%
    );
}

#gameOver {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.85);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 5;
}

#score {
    font-size: 20px;
    margin: 10px;
}

.controls button {
    width: 80px;
    font-size: 25px;
}

#message {
    color: #ffcc00;
    margin-top: 10px;
}
</style>
</head>

<body>

<header>
    <h1>🚀 ZAENALL</h1>
    <p>janlupp maikan</p>
</header>

<!-- HALAMAN LOGIN -->
<section id="loginPage">

    <div class="box">
        <h2>🔐 LOGIN</h2>

        <p style="margin:15px 0">
            Masukkan nama untuk bermain
        </p>

        <input
            type="text"
            id="username"
            placeholder="Masukkan username"
            maxlength="20"
        >

        <button id="loginBtn">
            LOGIN
        </button>

        <p id="message"></p>
    </div>

</section>


<!-- MENU UTAMA -->
<section id="menu" class="hidden">

    <div class="box">
        <h2>🏠 MENU UTAMA</h2>

        <p id="welcome"></p>

        <br>

        <button id="startBtn">
            🚀 MULAI GAME
        </button>

        <br>

        <button id="logoutBtn">
            🚪 LOGOUT
        </button>
    </div>

</section>


<!-- HALAMAN GAME -->
<section id="gamePage" class="hidden">

    <h2>🚀 SPACE SHOOTER</h2>

    <div id="score">
        Skor: 0
    </div>

    <div id="game">

        <div id="player"></div>

        <div id="gameOver">
            <h2>💥 GAME OVER</h2>

            <p id="finalScore"></p>

            <button id="retryBtn">
                🔄 MAIN LAGI
            </button>

            <button id="backBtn">
                🏠 MENU
            </button>
        </div>

    </div>

    <div class="controls">
        <button id="leftBtn">⬅️</button>
        <button id="shootBtn">🔫</button>
        <button id="rightBtn">➡️</button>
    </div>

    <p style="margin-top:15px;color:#aaa">
        Gerakkan pesawat dan tembak musuh!
    </p>

    <button id="menuBtn">
        🏠 KEMBALI KE MENU
    </button>

</section>


<script>

const loginPage = document.getElementById("loginPage");
const menu = document.getElementById("menu");
const gamePage = document.getElementById("gamePage");

const usernameInput = document.getElementById("username");
const message = document.getElementById("message");

const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreText = document.getElementById("score");

let username = "";
let playerX = 154;
let score = 0;
let running = false;

let bullets = [];
let enemies = [];

let animationId;
let enemyTimer;


/* LOGIN */
document.getElementById("loginBtn").onclick = function() {

    username = usernameInput.value.trim();

    if (username === "") {
        message.textContent = "Masukkan username terlebih dahulu!";
        return;
    }

    loginPage.classList.add("hidden");
    menu.classList.remove("hidden");

    document.getElementById("welcome").textContent =
        "Selamat datang, " + username + "!";
};


/* LOGOUT */
document.getElementById("logoutBtn").onclick = function() {

    stopGame();

    menu.classList.add("hidden");
    gamePage.classList.add("hidden");
    loginPage.classList.remove("hidden");

    usernameInput.value = "";
    message.textContent = "";
};


/* MULAI GAME */
document.getElementById("startBtn").onclick = function() {

    menu.classList.add("hidden");
    gamePage.classList.remove("hidden");

    startGame();
};


/* GERAK PESAWAT */
function moveLeft() {

    if (!running) return;

    playerX -= 25;

    if (playerX < 5) {
        playerX = 5;
    }

    player.style.left = playerX + "px";
}


function moveRight() {

    if (!running) return;

    playerX += 25;

    if (playerX > 303) {
        playerX = 303;
    }

    player.style.left = playerX + "px";
}


/* TOMBOL KONTROL */
document.getElementById("leftBtn").onclick = moveLeft;
document.getElementById("rightBtn").onclick = moveRight;


/* KEYBOARD */
document.addEventListener("keydown", function(e) {

    if (!running) return;

    if (e.key === "ArrowLeft") {
        moveLeft();
    }

    if (e.key === "ArrowRight") {
        moveRight();
    }

    if (e.code === "Space") {
        shoot();
    }

});


/* TEMBAK */
document.getElementById("shootBtn").onclick = shoot;

function shoot() {

    if (!running) return;

    const bullet = document.createElement("div");

    bullet.className = "bullet";

    bullet.style.left = (playerX + 19) + "px";
    bullet.style.top = "480px";

    game.appendChild(bullet);

    bullets.push(bullet);
}


/* BUAT MUSUH */
function createEnemy() {

    if (!running) return;

    const enemy = document.createElement("div");

    enemy.className = "enemy";

    enemy.style.left =
        Math.floor(Math.random() * 305) + "px";

    enemy.style.top = "-40px";

    game.appendChild(enemy);

    enemies.push(enemy);
}


/* MULAI GAME */
function startGame() {

    stopGame();

    score = 0;
    playerX = 154;
    running = true;

    player.style.left = playerX + "px";

    scoreText.textContent = "Skor: 0";

    document.getElementById("gameOver").style.display = "none";

    bullets = [];
    enemies = [];

    gameLoop();

    enemyTimer = setInterval(createEnemy, 900);
}


/* LOOP GAME */
function gameLoop() {

    if (!running) return;


    /* GERAK PELURU */
    bullets.forEach((bullet, index) => {

        let top = parseInt(bullet.style.top);

        top -= 8;

        bullet.style.top = top + "px";

        if (top < -20) {

            bullet.remove();

            bullets.splice(index, 1);

        }

    });


    /* GERAK MUSUH */
    enemies.forEach((enemy, index) => {

        let top = parseInt(enemy.style.top);

        top += 3;

        enemy.style.top = top + "px";


        /* MUSUH MENYENTUH PESAWAT */
        const playerRect = player.getBoundingClientRect();
        const enemyRect = enemy.getBoundingClientRect();

        if (
            playerRect.left < enemyRect.right &&
            playerRect.right > enemyRect.left &&
            playerRect.top < enemyRect.bottom &&
            playerRect.bottom > enemyRect.top
        ) {

            endGame();

        }


        /* PELURU MENEMBAK MUSUH */
        bullets.forEach((bullet, bulletIndex) => {

            const bulletRect = bullet.getBoundingClientRect();

            if (
                bulletRect.left < enemyRect.right &&
                bulletRect.right > enemyRect.left &&
                bulletRect.top < enemyRect.bottom &&
                bulletRect.bottom > enemyRect.top
            ) {

                enemy.remove();
                bullet.remove();

                enemies.splice(index, 1);
                bullets.splice(bulletIndex, 1);

                score++;

                scoreText.textContent =
                    "Skor: " + score;

            }

        });


        /* MUSUH LOLOS */
        if (top > 550) {

            enemy.remove();

            enemies.splice(index, 1);

        }

    });


    animationId = requestAnimationFrame(gameLoop);

}


/* GAME OVER */
function endGame() {

    running = false;

    clearInterval(enemyTimer);

    cancelAnimationFrame(animationId);

    document.getElementById("finalScore").textContent =
        "Skor " + username + ": " + score;

    document.getElementById("gameOver").style.display = "flex";

}


/* STOP GAME */
function stopGame() {

    running = false;

    clearInterval(enemyTimer);

    cancelAnimationFrame(animationId);

    bullets.forEach(bullet => bullet.remove());
    enemies.forEach(enemy => enemy.remove());

    bullets = [];
    enemies = [];

}


/* MAIN LAGI */
document.getElementById("retryBtn").onclick = function() {

    startGame();

};


/* KEMBALI KE MENU */
function backToMenu() {

    stopGame();

    gamePage.classList.add("hidden");
    menu.classList.remove("hidden");

}

document.getElementById("backBtn").onclick = backToMenu;
document.getElementById("menuBtn").onclick = backToMenu;

</script>

</body>
</html>
